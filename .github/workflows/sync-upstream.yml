# Keeps this fork's main in sync with BasedHardware/omi main.
# Uses the merge-upstream API: fast-forwards when possible, merges otherwise,
# and fails (never force-pushes) if main has conflicting changes.
# If upstream changes files under .github/workflows, GITHUB_TOKEN cannot push them;
# add a fine-grained PAT with Contents + Workflows write as the SYNC_TOKEN secret.
name: Sync fork with upstream

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'sammarcus/omi'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          if ! out=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main 2>&1); then
            echo "::error::Sync failed. main has likely diverged from upstream or touches workflow files. $out"
            exit 1
          fi
          echo "$out"
          echo "### Upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "$out" | jq -r '.message' >> "$GITHUB_STEP_SUMMARY"
